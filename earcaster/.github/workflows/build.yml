name: Compilar APK

on:
  push:
    paths-ignore:
      - '.github/capturas.sh'
      - '.github/workflows/capturas.yml'
      - '.github/workflows/functions.yml'
      - '.github/ai_smoke.py'
      - '.github/deploy_check.js'
      - '.github/function_logs.js'
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configuración de Firebase
        # If the repository has no app/google-services.json, it is taken from the GOOGLE_SERVICES_JSON secret.
        # Without either, the app builds without Firebase (spec 015).
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Earcaster.apk

      - name: Guardar el APK en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: Earcaster-apk
          path: Earcaster.apk

      - name: Publicar el APK en Releases (descarga directa desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Earcaster ${{ github.run_number }}
          files: Earcaster.apk

  # Publishes the landing page (web/ folder) and the freshly built APK at https://earcaster.web.app
  # Only on main and only if the FIREBASE_SERVICE_ACCOUNT secret exists.
  web:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Traer el APK compilado
        uses: actions/download-artifact@v4
        with:
          name: Earcaster-apk
          path: web

      - name: Comprobar que Firebase está configurado
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT: no se publica la web."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar en Firebase Hosting
        if: steps.check.outputs.ok == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: earcaster
          channelId: live
