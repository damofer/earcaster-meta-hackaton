plugins {
    id 'com.android.application'
}

// Firebase (spec 015): without google-services.json the app still builds and works on a single phone.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'app.oido'
    compileSdk 35

    defaultConfig {
        applicationId 'app.oido'
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '1.8'

        ndk {
            // Real phones (ARM) and the Android Studio emulator (x86_64)
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Material Design 3 visual components (cards, bottom sheets, sliders…)
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Offline speech recognition (https://alphacephei.com/vosk)
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    // Caregiver and patient connected (spec 015): accounts and synced data
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    // Scan the QR code with the camera without asking for the permission (Google Play services does it) and draw it
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.zxing:core:3.5.3'

    // Tests for the logic without Android (for example, how the time is said)
    testImplementation 'junit:junit:4.13.2'
}
