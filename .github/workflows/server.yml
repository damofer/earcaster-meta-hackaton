name: Server

on:
  push:
    paths:
      - 'server/**'
      - 'firebase.json'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Test
        working-directory: server
        run: |
          npm ci
          npm test

  deploy:
    # Deploys only the "muse" codebase, so Earcaster's own functions in the same Firebase project are untouched.
    # Needs the FIREBASE_DEPLOY_KEY repository secret, and META_API_KEY and ENGINE_TOKEN in Secret Manager.
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_DEPLOY_KEY != '' }}
    steps:
      - name: No deploy key
        if: env.HAS_KEY != 'true'
        run: echo "FIREBASE_DEPLOY_KEY is not set; nothing is deployed."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: google-github-actions/auth@v2
        if: env.HAS_KEY == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_KEY }}
      - name: Check the secrets
        # Until Meta's credits arrive there is no META_API_KEY: skip the deploy instead of failing.
        id: secrets
        if: env.HAS_KEY == 'true'
        run: |
          for s in META_API_KEY ENGINE_TOKEN; do
            if ! gcloud secrets versions describe latest --secret="$s" --project=earcaster >/dev/null 2>&1; then
              echo "::warning::$s is not in Secret Manager yet (or this account cannot see it); nothing is deployed."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci --prefix server
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes firebase-tools@15 deploy --only functions:muse --project earcaster --non-interactive
